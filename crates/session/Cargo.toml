[package]
name = "transcriber-session"
description = "Session state machine and orchestrator: type-bound consent gate, capture-thread and ring-buffer ownership, event bus. No platform code, no cfg(windows)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
zeroize = "1"
transcriber-core = { path = "../core" }
transcriber-audio = { path = "../audio" }

[dev-dependencies]
trybuild = "1"

[lints]
workspace = true
