## cargo-deny — the license gate from docs/constitution.md.
##
## Every new dependency needs an entry here or the merge is blocked. Copyleft
## licenses are refused outright: the project ships under Apache-2.0, and the
## PipeWire reference implementation we learn from (obs-pipewire-audio-capture)
## is GPL-2.0, so the boundary has to be machine-enforced rather than remembered.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow list is deliberately broader than the current dependency graph, so an
# entry nobody uses yet is expected — warning about it only buries real findings.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates (transcriber-core <- transcriber-audio <- ...) are
# path dependencies with no `version` requirement — pinning one would tie a
# crate's Cargo.toml to the workspace version and break at the next `feat:`
# minor bump (docs/release.md: `[workspace.package] version` is the single
# source of the version number). None of these crates publish to a registry
# (docs/release.md: "Kein Registry-Schritt") — every one carries
# `publish = false` — so the "any version from the registry" risk this ban
# guards against does not apply.
allow-wildcard-paths = true

# Nothing in the workspace may pull in a cloud SDK or a Python bridge — the
# constitution's don'ts, enforced at the dependency graph.
deny = [
    { crate = "openai-api-rs" },
    { crate = "aws-sdk-transcribe" },
    { crate = "pyo3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
yanked = "deny"
