## cargo-deny — the license gate from docs/constitution.md.
##
## Every new dependency needs an entry here or the merge is blocked. Copyleft
## licenses are refused outright: the project ships under Apache-2.0, and the
## PipeWire reference implementation we learn from (obs-pipewire-audio-capture)
## is GPL-2.0, so the boundary has to be machine-enforced rather than remembered.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Nothing in the workspace may pull in a cloud SDK or a Python bridge — the
# constitution's don'ts, enforced at the dependency graph.
deny = [
    { crate = "openai-api-rs" },
    { crate = "aws-sdk-transcribe" },
    { crate = "pyo3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
yanked = "deny"
