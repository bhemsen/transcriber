[workspace]
resolver = "2"
members = ["crates/core", "crates/audio", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/bhemsen/transcriber"
authors = ["transcriber contributors"]

# Opted into per crate via `[lints] workspace = true` — every crate, platform
# backends (audio-win, audio-mac, audio-linux) included. Only if a backend
# actually draws the `unsafe` exemption (a concrete case forces it — see
# docs/constitution.md) does that crate stop using `[lints] workspace = true`
# and instead duplicate every lint below except `unsafe_code`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
